name: Build & Deploy Staging
on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Publish to Registry
        uses: elgohr/Publish-Docker-Github-Action@v5
        env:
          TARGET: staging
          VERSION: ${{ github.sha }}
        with:
          registry: epraseregistry.azurecr.io
          name: epraseregistry.azurecr.io/eprase-client
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          buildargs: TARGET,VERSION

  #
  release:
    # Required for OIDC authentication with Azure
    permissions:
      id-token: write
      contents: read

    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Update CLIENT_VERSION
        uses: garygrossgarten/github-action-ssh@release
        with:
        # command: sed -i 's/CLIENT_VERSION\=.*/CLIENT_VERSION=${{ github.event.release.tag_name }}/' .env
        # sed replaces instances of words in files
          command: sed -i 's/CLIENT_VERSION\=.*/CLIENT_VERSION=latest/' .env
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          privateKey: ${{ secrets.PRIVATE_KEY}}

    ##  - name: Compose Down
    #    uses: garygrossgarten/github-action-ssh@release
    #    with:
    #     # Got rid of -v switch here as do not want to delete database when live content being entered!
    #      command: sudo docker compose down
    #      host: ${{ secrets.HOST }}
    #      username: ${{ secrets.USERNAME }}
    #      privateKey: ${{ secrets.PRIVATE_KEY}}

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: epraseregistry.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME  }}
          password: ${{ secrets.REGISTRY_PASSWORD }}


      - name: Compose Pull
        uses: garygrossgarten/github-action-ssh@release
        with:
          command: |
            docker login -u eprase-token --password-stdin ${{ secrets.REGISTRY_TOKEN }} epraseregistry.azurecr.io
            # az arc login --name  ${{ secrets.REGISTRY_USERNAME  }}
            sudo docker compose pull client
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          privateKey: ${{ secrets.PRIVATE_KEY}}

      - name: Compose Up
        uses: garygrossgarten/github-action-ssh@release
        with:
          command: sudo -E docker compose up -d --no-deps client
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          privateKey: ${{ secrets.PRIVATE_KEY}}


